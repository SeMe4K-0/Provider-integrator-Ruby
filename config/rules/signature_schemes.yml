# Определение схемы подписи webhook по ключевым словам из description заголовка
# с подписью. OpenAPI не описывает криптосхемы формально, поэтому единственный
# источник — текст описания заголовка. Правила проверяются сверху вниз,
# побеждает первое совпадение.
#
# Если не совпало ничего — берётся default, и предположение помечается как
# неподтверждённое: в INTEGRATION.md и в комментарии сгенерированного кода.

rules:
  - keywords: ["hmac-sha512", "hmac sha512", "sha512", "sha-512"]
    algorithm: SHA512
  - keywords: ["hmac-sha256", "hmac sha256", "sha256", "sha-256"]
    algorithm: SHA256
  - keywords: ["hmac-sha1", "hmac sha1", "sha1", "sha-1"]
    algorithm: SHA1

# Кодировка по умолчанию — hex; если в описании встречается одно из этих слов,
# подпись считается закодированной в base64
base64_keywords: ["base64", "б64"]

default:
  algorithm: SHA256
  encoding: hex
