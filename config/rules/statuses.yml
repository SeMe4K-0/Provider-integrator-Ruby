# Правила разбора статусов операции.
#
# field_names — имена, под которыми провайдер может передавать статус операции.
#   Первое поле с таким именем и перечислением значений считается статусным.
# canonical — синонимы статусов провайдера → канонические статусы Space Payments
#   (in_progress, approved, rejected). Значение, которого нет ни в одном списке,
#   не угадывается: DataMapper помечает его как требующее ручного решения.

field_names:
  - status
  - state
  - payment_status
  - transfer_status
  - operation_status

canonical:
  in_progress:
    - pending
    - processing
    - created
    - new
    - waiting
    - in_progress
    - queued
    - accepted
    - sent
    - registered

  approved:
    - completed
    - success
    - succeeded
    - paid
    - approved
    - done
    - confirmed

  rejected:
    - failed
    - error
    - declined
    - cancelled
    - canceled
    - void
    - rejected
    - expired
