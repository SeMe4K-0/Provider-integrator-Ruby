# Синонимы статусов провайдера → канонические статусы Space Payments.
# Канонические значения: in_progress, approved, rejected.
# Если статус провайдера не найден ни в одном списке — DataMapper не угадывает,
# а помечает его как unresolved (см. MappingReport).

in_progress:
  - pending
  - processing
  - created
  - new
  - waiting
  - in_progress
  - queued

approved:
  - completed
  - success
  - succeeded
  - paid
  - approved
  - done
  - confirmed

rejected:
  - failed
  - error
  - declined
  - cancelled
  - canceled
  - void
  - rejected
  - expired
